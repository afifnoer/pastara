          application/json:
            schema:
              type: object
              required: [target_opd_unit_id, note]
              properties:
                target_opd_unit_id:
                  type: integer
                new_category_id:
                  type: integer
                  nullable: true
                note:
                  type: string
                  minLength: 20
                  maxLength: 500
