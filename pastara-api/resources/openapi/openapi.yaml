openapi: 3.0.3
info:
  title: PASTARA REST API (pastara-api)
  version: 1.0.0
  description: |
    Spesifikasi OpenAPI 3.0 (Swagger) untuk Backend REST API **PASTARA** (*Platform Pengaduan Layanan Publik Dua Arah & Escrow Verifikasi Warga*) Kabupaten Cilacap.

    ### Konvensi Standar Amplop JSON
    - **Respons Sukses:** `{ "success": true, "server_time": "2026-11-22T02:00:00Z", "data": ..., "meta"?: ... }`
    - **Respons Galat:** `{ "success": false, "server_time": "2026-11-22T02:00:00Z", "error": { "code": "...", "message": "...", "fields"?: ... } }`
    - **Autentikasi:** Stateless Bearer Token (Laravel Sanctum, masa berlaku 24 jam).
    - **Zona Waktu:** Seluruh timestamp disimpan & dikirim dalam format ISO-8601 UTC (`Z`).

servers:
  - url: https://staging.afiefnoer.my.id/api/v1
    description: Server Staging (branch develop)
  - url: https://afiefnoer.my.id/api/v1
    description: Server Production (branch main)
  - url: http://localhost:8000/api/v1
    description: Server Pengembangan Lokal

tags:
  - name: System
    description: Pemeriksaan kesehatan layanan API
  - name: M01 - Autentikasi & Profil
    description: Registrasi warga, login Sanctum, profil, dan kata sandi (Endpoint #1–#6)
  - name: M02 - Portal Transparansi Publik
    description: Data referensi, peta masalah, jelajah laporan publik, lacak tiket, dan rapor kepatuhan OPD (Endpoint #7–#12)
  - name: M03 - Pelaporan Warga
    description: Deteksi duplikat Haversine, buat laporan geospasial, +1 dukung, pantau, dan daftar laporan warga (Endpoint #13–#17)
  - name: M06 - Escrow Sign-Off & Rating
    description: Verifikasi warga Setuju/Tolak (Veto) dalam jendela 72 jam & micro-rating kualitas fisik (Endpoint #18–#20)
  - name: M04 - Disposisi Admin Unit
    description: Kotak masuk unit, persetujuan Jalur 1, penjadwalan APBD Jalur 2, milestone, tolak, dan reroute (Endpoint #21–#30)
  - name: M05 - Tugas Lapangan Petugas
    description: Daftar tugas petugas, catatan progres, dan unggah bukti foto After ber-EXIF (Endpoint #31–#33)
  - name: M08 - Pengawasan Inspektorat
    description: Monitoring lintas OPD, sidang sengketa warga, dan rapor internal (Endpoint #34–#36)
  - name: M10 - Notifikasi In-App
    description: Daftar notifikasi dan tandai sudah dibaca (Endpoint #37–#38)
  - name: M11 - Super Admin & Audit Log
    description: Manajemen pengguna internal, unit kerja, kategori, wilayah, dan audit log baca-saja (Endpoint #39–#43)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SanctumToken
      description: Personal Access Token dari `POST /auth/login` atau `POST /auth/register`

  schemas:
    UserRole:
      type: string
      enum: [WARGA, ADMIN_UNIT, PETUGAS, INSPEKTORAT, SUPER_ADMIN]
    UnitLevel:
      type: string
      enum: [OPD, DESA, KELURAHAN, INSPEKTORAT]
    IssueType:
      type: string
      enum: [POINT, LINEAR]
    ResolutionTrack:
      type: string
      enum: [OPERATIONAL, APBD]
    ReportStatus:
      type: string
      enum:
        - SUBMITTED
        - ROUTED_TO_UNIT
        - REJECTED
        - BUDGET_SCHEDULED
        - IN_PROGRESS
        - PENDING_CITIZEN_SIGN_OFF
        - DISPUTED
        - REOPENED_BY_AUDIT
        - VERIFIED_CLOSED
        - AUTO_VERIFIED_CLOSED
        - CLOSED_BY_AUDIT
    SlaZone:
      type: string
      enum: [GREEN, YELLOW, RED, PAUSED, APBD_SCHEDULED, STOPPED]
    RejectionReasonCode:
      type: string
      enum: [HOAX, OUT_OF_JURISDICTION, INCOMPLETE, OTHER]
    DisputeDecision:
      type: string
      enum: [REOPENED, CLOSED]
    AuditActionType:
      type: string
      enum:
        - SUBMITTED
        - ROUTED
        - REROUTED
        - REJECTED
        - ASSIGNED
        - OFFICER_CHANGED
        - BUDGET_SCHEDULED
        - MILESTONE_UPDATED
        - MILESTONE_OVERDUE
        - EXECUTION_STARTED
        - PROGRESS_NOTE
        - SLA_WARNING
        - SLA_OVERDUE
        - EVIDENCE_SUBMITTED
        - CITIZEN_APPROVED
        - CITIZEN_REJECTED
        - AUTO_VERIFIED
        - AUDIT_REOPENED
        - AUDIT_CLOSED
        - RATED
        - UPVOTED
        - USER_CREATED
        - USER_UPDATED
        - USER_DEACTIVATED
        - CATEGORY_UPDATED
        - UNIT_UPDATED

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 3
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 52

    SuccessEnvelope:
      type: object
      required: [success, server_time, data]
      properties:
        success:
          type: boolean
          example: true
        server_time:
          type: string
          format: date-time
          example: "2026-11-22T02:00:00Z"
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorEnvelope:
      type: object
      required: [success, server_time, error]
      properties:
        success:
          type: boolean
          example: false
        server_time:
          type: string
          format: date-time
          example: "2026-11-22T02:00:00Z"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Data yang dikirim belum lengkap atau tidak valid.
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Warga Pelapor Uji
        email:
          type: string
          format: email
          example: warga.demo@pastara.id
        phone:
          type: string
          nullable: true
          example: "081200000001"
        role:
          $ref: '#/components/schemas/UserRole'
        opd_unit_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
          example: true

    ReportDetail:
      type: object
      properties:
        id:
          type: integer
          example: 103
        ticket_code:
          type: string
          example: PST-ESCROW01
        title:
          type: string
          example: Lampu PJU Padam di Jl. Gatot Subroto, Cilacap Tengah
        description_sanitized:
          type: string
        status:
          $ref: '#/components/schemas/ReportStatus'
        status_label:
          type: string
          example: Menunggu Konfirmasi Warga
        resolution_track:
          $ref: '#/components/schemas/ResolutionTrack'
          nullable: true
        current_cycle:
          type: integer
          example: 1
        is_secret:
          type: boolean
          example: false
        upvote_count:
          type: integer
          example: 8
        sla:
          type: object
          properties:
            sla_hours_snapshot:
              type: integer
              example: 24
            sla_deadline_at:
              type: string
              format: date-time
              nullable: true
            sla_zone:
              $ref: '#/components/schemas/SlaZone'
            sla_remaining_seconds:
              type: integer
              nullable: true
            is_sla_overdue:
              type: boolean
            is_milestone_overdue:
              type: boolean
            is_late:
              type: boolean

  responses:
    Unauthorized:
      description: Sesi tidak valid atau kedaluwarsa (HTTP 401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            server_time: "2026-11-22T02:00:00Z"
            error:
              code: UNAUTHENTICATED
              message: Sesi Anda telah berakhir. Silakan masuk kembali.
    Forbidden:
      description: Tidak memiliki hak akses atau melanggar aturan Escrow (HTTP 403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Data tidak ditemukan atau diisolasi oleh Policy (HTTP 404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictTransition:
      description: Transisi status tidak diizinkan atau konflik data (HTTP 409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Data masukan tidak valid (HTTP 422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Batas rate limiter terlampaui (HTTP 429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

paths:
  /health:
    get:
      tags: [System]
      summary: Cek status kesehatan API
      responses:
        '200':
          description: Layanan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/register:
    post:
      tags: [M01 - Autentikasi & Profil]
      summary: "#1 Registrasi akun warga baru (role dikunci WARGA)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 150
                phone:
                  type: string
                  nullable: true
                  example: "081234567890"
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Akun warga berhasil dibuat & token Sanctum diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [M01 - Autentikasi & Profil]
      summary: "#2 Login semua role (rate limit 5/menit per email+IP)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: warga.demo@pastara.id
                password:
                  type: string
                  example: Pastara2027!
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [M01 - Autentikasi & Profil]
      summary: "#3 Logout & cabut token Sanctum aktif"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [M01 - Autentikasi & Profil]
      summary: "#4 Profil pengguna login & jumlah notifikasi belum dibaca"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data pengguna aktif
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    patch:
      tags: [M01 - Autentikasi & Profil]
      summary: "#5 Perbarui nama & nomor HP pengguna"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 100
                phone:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Profil diperbarui
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/password:
    put:
      tags: [M01 - Autentikasi & Profil]
      summary: "#6 Ubah password & cabut token perangkat lain"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password berhasil diubah
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /public/reference-data:
    get:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#7 Daftar kategori, unit kerja, kecamatan, & desa aktif Cilacap"
      responses:
        '200':
          description: Data referensi publik

  /public/map-markers:
    get:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#8 Marker peta masalah publik (selalu is_secret = false)"
      parameters:
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - in: query
          name: opd_unit_id
          schema:
            type: integer
        - in: query
          name: district_id
          schema:
            type: integer
        - in: query
          name: bbox
          schema:
            type: string
            example: "-7.85,108.50,-7.15,109.45"
      responses:
        '200':
          description: Daftar koordinat marker laporan non-rahasia

  /public/reports:
    get:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#9 Jelajah daftar laporan publik berpaginasi (20/halaman)"
      parameters:
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - in: query
          name: opd_unit_id
          schema:
            type: integer
        - in: query
          name: district_id
          schema:
            type: integer
        - in: query
          name: overdue_only
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, upvotes, sla]
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Daftar ringkas laporan publik (`PublicReportCardResource`)

  /public/reports/{ticket_code}:
    get:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#10 Detail tiket publik (mengembalikan 404 jika is_secret = true)"
      parameters:
        - in: path
          name: ticket_code
          required: true
          schema:
            type: string
            example: PST-ESCROW01
      responses:
        '200':
          description: Detail tiket (`PublicReportResource`)
        '404':
          $ref: '#/components/responses/NotFound'

  /public/track:
    post:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#11 Lacak tiket biasa maupun Mode Rahasia Ber-Token (10/menit per IP)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_code]
              properties:
                ticket_code:
                  type: string
                  example: PST-PURW2027
                secret_token:
                  type: string
                  nullable: true
                  example: TKN-DEMO-2027
      responses:
        '200':
          description: "Detail tiket atau prompt { requires_secret_token: true }"
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /public/scorecard:
    get:
      tags: [M02 - Portal Transparansi Publik]
      summary: "#12 Rapor kepatuhan OPD & statistik jujur (memisahkan Terjadwal APBD)"
      parameters:
        - in: query
          name: month
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          schema:
            type: integer
            minimum: 2025
            maximum: 2030
      responses:
        '200':
          description: Summary global dan tabel rapor OPD

  /reports/nearby:
    get:
      tags: [M03 - Pelaporan Warga]
      summary: "#13 Deteksi duplikat Haversine radius dinamis (200m/750m, maks 5 tiket)"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category_id
          required: true
          schema:
            type: integer
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            minimum: -7.85
            maximum: -7.15
            example: -7.6350
        - in: query
          name: longitude
          required: true
          schema:
            type: number
            minimum: 108.5
            maximum: 109.45
            example: 109.0180
      responses:
        '200':
          description: Daftar tiket serupa terdekat (`{ radius_m, matches }`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reports:
    post:
      tags: [M03 - Pelaporan Warga]
      summary: "#14 Kirim laporan pengaduan geospasial baru (10/jam per user)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category_id, district_id, village_id, latitude, longitude, title, description, is_secret, photos]
              properties:
                category_id:
                  type: integer
                district_id:
                  type: integer
                village_id:
                  type: integer
                latitude:
                  type: number
                  minimum: -7.85
                  maximum: -7.15
                longitude:
                  type: number
                  minimum: 108.5
                  maximum: 109.45
                address_detail:
                  type: string
                  maxLength: 255
                title:
                  type: string
                  minLength: 10
                  maxLength: 120
                description:
                  type: string
                  minLength: 20
                  maxLength: 2000
                is_secret:
                  type: boolean
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Laporan dibuat & dirutekan (`TR-01`), mengembalikan `secret_token` sekali tampil jika rahasia
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /reports/{id}/upvote:
    post:
      tags: [M03 - Pelaporan Warga]
      summary: "#15 Beri dukungan +1 Upvote & pantau otomatis tiket warga lain"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dukungan berhasil ditambahkan
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictTransition'

  /reports/{id}/watch:
    patch:
      tags: [M03 - Pelaporan Warga]
      summary: "#16 Ubah status langganan notifikasi tiket yang didukung"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_watching]
              properties:
                is_watching:
                  type: boolean
      responses:
        '200':
          description: Status pantau diperbarui
        '404':
          $ref: '#/components/responses/NotFound'

  /citizen/reports:
    get:
      tags: [M03 - Pelaporan Warga]
      summary: "#17 Daftar laporan milik warga atau yang sedang dipantau"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [mine, watching]
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Daftar laporan (`CitizenReportResource`)

  /reports/{ticket_code}/sign-off/approve:
    post:
      tags: [M06 - Escrow Sign-Off & Rating]
      summary: "#18 Citizen Sign-Off Setuju Selesai (TR-08 -> VERIFIED_CLOSED)"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: ticket_code
          required: true
          schema:
            type: string
            example: PST-ESCROW01
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_token:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Tiket resmi ditutup terverifikasi warga
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictTransition'

  /reports/{ticket_code}/sign-off/reject:
    post:
      tags: [M06 - Escrow Sign-Off & Rating]
      summary: "#19 Citizen Sign-Off Tolak / Veto Klaim Selesai (TR-09 -> DISPUTED)"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: ticket_code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [reason, photos]
              properties:
                reason:
                  type: string
                  minLength: 20
                  maxLength: 1000
                secret_token:
                  type: string
                  nullable: true
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Veto tercatat & sengketa dibuka untuk Inspektorat
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ConflictTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reports/{ticket_code}/rating:
    post:
      tags: [M06 - Escrow Sign-Off & Rating]
      summary: "#20 Micro-Rating kecepatan & kualitas fisik (khusus VERIFIED_CLOSED, maks 1x)"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: ticket_code
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speed_score, physical_quality_score]
              properties:
                speed_score:
                  type: integer
                  minimum: 1
                  maximum: 5
                physical_quality_score:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 500
                  nullable: true
                secret_token:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Rating disimpan & Indeks Mutu Fisik diperbarui
        '409':
          $ref: '#/components/responses/ConflictTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  /unit/reports:
    get:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#21 Kotak masuk tiket khusus unit kerja Admin Unit"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [verification, in_progress, apbd, sign_off, disputed, closed, rejected]
        - in: query
          name: category_id
          schema:
            type: integer
        - in: query
          name: overdue_only
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Daftar tiket milik unit (`UnitReportResource`)

