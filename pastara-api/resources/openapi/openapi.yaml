            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  type: string
                  maxLength: 30
                  nullable: true
                opd_unit_id:
                  type: integer
                  nullable: true
                is_active:
                  type: boolean
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  nullable: true
