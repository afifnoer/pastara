      summary: "#30 Ganti petugas lapangan tanpa mengubah tenggat SLA"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officer_id, reason]
              properties:
                officer_id:
                  type: integer
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
      responses:
