        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail tiket unit
        '404':
          $ref: '#/components/responses/NotFound'

  /unit/officers:
    get:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#23 Daftar petugas aktif di unit Admin beserta beban tugas aktif"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar petugas unit

  /unit/reports/{id}/assign:
    post:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#24 Setujui & tugaskan Jalur 1 Operasional (TR-04 -> IN_PROGRESS)"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officer_id]
              properties:
                officer_id:
                  type: integer
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Petugas ditugaskan & SLA dimulai
        '409':
          $ref: '#/components/responses/ConflictTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  /unit/reports/{id}/schedule-apbd:
    post:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#25 Jadwalkan ke Jalur 2 Anggaran APBD (TR-05 -> BUDGET_SCHEDULED)"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fiscal_year, proposal_ref_number, target_quarter, note]
              properties:
                fiscal_year:
                  type: integer
                  example: 2027
                proposal_ref_number:
                  type: string
                  example: RKA-DPUPR-2027-014
                target_quarter:
                  type: string
                  enum: [Q1, Q2, Q3, Q4]
                estimated_budget:
                  type: number
                note:
                  type: string
                  minLength: 20
                  maxLength: 1000
                document_proof:
                  type: string
                  format: binary
      responses:
        '200':
          description: Tiket dijadwalkan ke Jalur 2 APBD
        '409':
          $ref: '#/components/responses/ConflictTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  /unit/reports/{id}/apbd-milestones:
    post:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#26 Perbarui milestone triwulanan / unggah dokumen bukti RKA APBD"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [quarter_label, progress_note]
              properties:
                quarter_label:
                  type: string
                  example: 2027-Q1
                progress_note:
                  type: string
                  minLength: 20
                  maxLength: 1000
                document_proof:
                  type: string
                  format: binary
                attachment:
                  type: string
                  format: binary
      responses:
        '201':
          description: Milestone APBD disimpan

  /unit/reports/{id}/start-execution:
    post:
      tags: [M04 - Disposisi Admin Unit]
      summary: "#27 Mulai eksekusi lapangan dari tiket APBD (TR-06 -> IN_PROGRESS)"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [execution_target_date, officer_id]
              properties:
                execution_target_date:
                  type: string
                  format: date
                  example: "2027-05-30"
                officer_id:
                  type: integer
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Eksekusi APBD dimulai & SLA berjalan hingga target date

