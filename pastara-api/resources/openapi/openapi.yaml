                action_note:
                  type: string
                  minLength: 20
                  maxLength: 1000
                photos:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
                device_latitude:
                  type: number
                  nullable: true
                device_longitude:
                  type: number
                  nullable: true
