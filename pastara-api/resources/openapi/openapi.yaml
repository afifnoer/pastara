      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 10
                  maxLength: 1000
                photos:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Catatan progres disimpan

  /officer/tasks/{id}/evidence:
    post:
      tags: [M05 - Tugas Lapangan Petugas]
      summary: "#33 Unggah foto bukti After ber-EXIF & kunci ke Escrow (TR-07/TR-13 -> PENDING_CITIZEN_SIGN_OFF)"
      security:
        - bearerAuth: []
